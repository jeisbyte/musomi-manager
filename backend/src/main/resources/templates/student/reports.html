<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base}">
<head>
    <title>Report Cards</title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="text-2xl font-serif font-semibold text-slate-900 mb-6">Report Cards</h1>

        <div th:if="${#lists.isEmpty(reports)}">
            <div th:replace="~{fragments/empty-state :: empty-state('file-text', 'No report cards yet', 'Your report cards will appear here once published at the end of the term.')}"></div>
        </div>

        <div th:if="${not #lists.isEmpty(reports)}" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="divide-y divide-slate-100">
                <div th:each="report : ${reports}" class="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-slate-50 transition-colors">
                    <div>
                        <div class="font-medium text-slate-900 mb-1">
                            <span th:text="${report.termName}">Term</span>, <span th:text="${report.academicYear}">Year</span>
                        </div>
                        <div class="flex items-center gap-2 text-sm text-slate-500">
                            Generated on <span th:text="${report.generatedAt}">Date</span>
                        </div>
                    </div>
                    <div class="shrink-0">
                        <a th:href="${report.downloadUrl}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex w-full sm:w-auto items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-700 transition-colors shadow-sm">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            Download PDF
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
