<div th:fragment="empty-state(icon, title, message)" class="flex flex-col items-center justify-center p-8 text-center bg-white rounded-xl border border-slate-200 shadow-sm">
    <div class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center mb-4">
        <i th:data-lucide="${icon}" class="w-6 h-6 text-slate-400"></i>
    </div>
    <h3 class="text-base font-semibold text-slate-900 mb-1 font-serif" th:text="${title}">No data</h3>
    <p class="text-sm text-slate-500 max-w-sm mx-auto" th:text="${message}">We couldn't find anything here.</p>
</div>
