<div th:fragment="pagination(page)" th:if="${page != null and page.totalPages > 1}" class="flex items-center justify-between mt-6">
    <div class="hidden sm:block text-sm text-slate-500">
        Showing <span class="font-medium text-slate-900" th:text="${page.number * page.size + 1}">1</span> to 
        <span class="font-medium text-slate-900" th:text="${page.number * page.size + page.numberOfElements}">10</span> of 
        <span class="font-medium text-slate-900" th:text="${page.totalElements}">97</span> results
    </div>
    <div class="flex items-center gap-2">
        <button type="button" 
                th:disabled="${page.first}"
                hx-get="${page.first ? '' : '?page=' + (page.number - 1)}"
                hx-target="#list-container"
                hx-select="#list-container > *"
                hx-swap="outerHTML"
                class="inline-flex items-center justify-center w-9 h-9 rounded-md border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-700 disabled:opacity-50 disabled:cursor-not-allowed">
            <span class="sr-only">Previous</span>
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
        <button type="button" 
                th:disabled="${page.last}"
                hx-get="${page.last ? '' : '?page=' + (page.number + 1)}"
                hx-target="#list-container"
                hx-select="#list-container > *"
                hx-swap="outerHTML"
                class="inline-flex items-center justify-center w-9 h-9 rounded-md border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-700 disabled:opacity-50 disabled:cursor-not-allowed">
            <span class="sr-only">Next</span>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
    </div>
</div>

<div th:fragment="load-more(nextUrl)" th:if="${nextUrl != null}" class="flex justify-center mt-6">
    <button type="button"
            th:hx-get="${nextUrl}"
            hx-target="closest .load-more-container"
            hx-swap="outerHTML"
            hx-indicator="#load-more-indicator"
            class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-brand-700 bg-brand-50 rounded-lg hover:bg-brand-100 focus:outline-none focus:ring-2 focus:ring-brand-700 transition-colors">
        Load more
        <i data-lucide="loader-2" id="load-more-indicator" class="w-4 h-4 animate-spin htmx-indicator hidden"></i>
    </button>
</div>
