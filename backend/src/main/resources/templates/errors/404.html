<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base}">
<head>
    <title>Page Not Found</title>
</head>
<body>
    <div layout:fragment="content" class="flex flex-col items-center justify-center py-16 text-center">
        <div class="w-16 h-16 rounded-full bg-brand-50 flex items-center justify-center mb-6">
            <i data-lucide="map" class="w-8 h-8 text-brand-700"></i>
        </div>
        <h1 class="text-2xl font-serif font-semibold text-slate-900 mb-2">We could not find that page.</h1>
        <p class="text-slate-500 mb-8 max-w-sm">The page you are looking for doesn't exist or has been moved.</p>
        <a th:href="@{/student/dashboard}" class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-brand-700 rounded-lg hover:bg-brand-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-700 transition-colors">
            Back to Dashboard
        </a>
    </div>
</body>
</html>
