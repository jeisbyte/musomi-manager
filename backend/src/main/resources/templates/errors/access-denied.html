<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/auth}">
<head>
    <title>Access Denied</title>
</head>
<body>
    <div layout:fragment="content" class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center">
        <div class="w-16 h-16 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-6">
            <i data-lucide="shield-alert" class="w-8 h-8 text-red-600"></i>
        </div>
        <h1 class="text-2xl font-serif font-semibold text-slate-900 mb-2">Access Denied</h1>
        <p class="text-slate-500 mb-8 max-w-xs mx-auto">You do not have permission to view this page. Please sign in with an authorized account.</p>
        <a th:href="@{/login}" class="inline-flex w-full items-center justify-center px-4 py-2.5 text-sm font-medium text-white bg-brand-700 rounded-lg hover:bg-brand-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-700 transition-colors">
            Sign in
        </a>
    </div>
</body>
</html>
