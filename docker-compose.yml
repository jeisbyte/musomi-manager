services:
  postgres:
    image: postgres:16
    container_name: musomi-postgres
    environment:
      POSTGRES_DB: musomi_manager
      POSTGRES_USER: musomi
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: